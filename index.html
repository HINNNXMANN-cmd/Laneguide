<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lane Guide">
<meta name="theme-color" content="#0b1220">
<link rel="apple-touch-icon" href="icon.svg">
<title>Lane Guide</title>
<style>
:root{--bg:#0b1220;--card:#141d30;--ink:#eef3ff;--mute:#8da0c4;--hi:#2bd48a;--neutral:#3a4764;--warn:#ffb020;--bad:#ff5d5d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);-webkit-user-select:none;user-select:none}
.top{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:14px;margin-top:10px}
.big{font-size:34px;font-weight:700;min-width:96px}
.instr{font-size:18px;line-height:1.3}
.road{color:var(--mute);font-size:13px;margin-top:2px}
.map{height:120px;margin-top:10px;border-radius:16px;background:linear-gradient(#10192c,#0d1526);position:relative;overflow:hidden}
.map svg{width:100%;height:100%}
.panel{background:var(--card);border-radius:16px;margin-top:10px;padding:12px;min-height:150px}
.panel.hidden .lanes{opacity:.25}
.lanes{display:flex;gap:6px;justify-content:center;transition:opacity .3s}
.lane{flex:1;max-width:84px;border-radius:10px;background:var(--neutral);padding:8px 2px 6px;text-align:center;border:2px solid transparent}
.lane.rec{background:#0f3a2b;border-color:var(--hi)}
.lane.cur{box-shadow:0 0 0 3px var(--warn) inset}
.lane svg{width:44px;height:52px}
.lane small{display:block;font-size:11px;color:var(--mute)}
.lane.rec small{color:var(--hi)}
.badge{display:inline-block;background:#1f2c49;border-radius:8px;padding:3px 8px;font-size:13px;margin:6px 6px 0 0}
.note{margin-top:8px;font-size:14px;color:var(--warn)}
.ctrl{background:var(--card);border-radius:16px;margin:10px 0;padding:12px;display:grid;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select{background:#22305280;color:var(--ink);border:1px solid #33456f;border-radius:10px;padding:10px 14px;font-size:15px}
button.primary{background:var(--hi);color:#04170f;border:0;font-weight:700}
input[type=range]{flex:1}
.foot{color:var(--mute);font-size:12px;padding-bottom:20px}
</style>
</head>
<body>
<div class="top"><div class="big" id="dist">--</div><div><div class="instr" id="instr">Press Start drive</div><div class="road" id="road"></div></div></div>
<div class="map"><svg viewBox="0 0 400 120" id="mapsvg"></svg></div>
<div class="panel hidden" id="panel"><div class="lanes" id="lanes"></div><div id="info"></div><div class="note" id="note"></div></div>
<div class="ctrl">
  <div class="row"><button class="primary" id="start">Start drive</button><button id="reset">Reset</button>
    <select id="lang"><option value="en">English</option><option value="ar">العربية</option></select>
    <button id="voice">Voice: on</button></div>
  <div class="row">Speed <input type="range" id="spd" min="30" max="130" value="90"><span id="spdv">90 km/h</span></div>
  <div class="row">My lane <select id="mylane"></select>
    <label><input type="checkbox" id="noise"> GPS noise</label></div>
</div>
<div class="foot">Demo with sample road data. Lane guidance is computed on-device with no internet. Real map data import comes next.</div>

<script>/* Lane guidance engine (offline, no network). UMD: works in browser and Node. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.LaneEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {

  /* ---------- Lane data schema ----------
  Segment = {
    id, direction:'forward', laneCount, geometry:[[lat,lon],...],
    lanes:[{ index:0 (leftmost), turns:['left','through','right','exit','merge','split','uturn'],
             restrictions:[], changeLeft:true, changeRight:true }],
    exitInfo:{ number, ref, destination, nextRoad } | null,
    roundabout:{ exits:[{n, angle}] } | null,
    source, updated (ISO), confidence 0..1, complete:boolean
  }
  Missing lane data => lanes:null  -> only conventional guidance, never an invented lane.
  ------------------------------------- */

  const MOVES = ['left', 'slight_left', 'through', 'slight_right', 'right', 'exit_left', 'exit_right', 'uturn', 'merge', 'split'];

  // Parse OSM turn:lanes ("left|through|through;right|right") into lane objects.
  function parseOsmTurnLanes(tag, laneCount) {
    if (!tag) return null;
    const parts = tag.split('|');
    if (laneCount && parts.length !== laneCount) return null; // ambiguous -> reject
    return parts.map((p, i) => ({
      index: i,
      turns: (p === '' || p === 'none' ? ['through'] : p.split(';')).map(t => t === 'straight' ? 'through' : t),
      restrictions: [], changeLeft: true, changeRight: true
    }));
  }

  // Lanes that support the route manoeuvre. Returns null if no usable lane data.
  function recommendedLanes(segment, maneuver) {
    if (!segment || !segment.lanes || !segment.lanes.length) return null;
    const want = maneuver === 'exit_right' || maneuver === 'exit_left' ? [maneuver, maneuver.replace('exit_', '')] : [maneuver];
    const hit = segment.lanes.filter(l => l.turns.some(t => want.includes(t) || (maneuver.startsWith('exit') && t === 'exit')));
    return hit.length ? hit.map(l => l.index) : null;
  }

  // Warning distance (m) from speed (m/s), lanes to cross, and GPS accuracy (m).
  function warningDistance(speed, lanesToCross, gpsAccuracy, cfg) {
    cfg = Object.assign({ baseSeconds: 25, secondsPerLane: 6, min: 150, max: 2000 }, cfg || {});
    const t = cfg.baseSeconds + cfg.secondsPerLane * Math.max(0, lanesToCross);
    return Math.round(Math.min(cfg.max, Math.max(cfg.min, speed * t + (gpsAccuracy || 0) * 2)));
  }

  function lanesToCross(currentLane, rec) {
    if (currentLane == null || !rec) return 0;
    return Math.min(...rec.map(i => Math.abs(i - currentLane)));
  }

  // Build guidance for the upcoming manoeuvre.
  function buildGuidance(ctx) {
    const { segment, maneuver, distance, speed = 20, gpsAccuracy = 10, currentLane = null, cfg } = ctx;
    const rec = recommendedLanes(segment, maneuver);
    const hasLanes = !!rec;
    const cross = lanesToCross(currentLane, rec);
    const warnAt = warningDistance(speed, cross, gpsAccuracy, cfg);
    const out = {
      maneuver, distance, hasLanes, recommended: rec || [], laneCount: hasLanes ? segment.lanes.length : null,
      show: distance <= warnAt, warnAt, lanesToCross: cross, correctLane: hasLanes && currentLane != null ? rec.includes(currentLane) : null,
      exit: segment && segment.exitInfo || null, confidence: segment ? segment.confidence : null,
      lanes: hasLanes ? segment.lanes.map(l => ({ index: l.index, turns: l.turns, recommended: rec.includes(l.index) })) : null,
      note: null
    };
    // Safety: if far from correct lane and little distance, advise next safe manoeuvre instead.
    const needed = warningDistance(speed, cross, 0, { min: 0 });
    if (hasLanes && currentLane != null && !out.correctLane && distance < needed * 0.6) {
      out.unsafe = true;
      out.note = 'too_late';
    }
    return out;
  }

  // Describe recommended lanes in words (position-based).
  function laneWords(rec, count) {
    if (!rec || !count) return null;
    const all = rec.length === count;
    if (all) return { key: 'any', rec };
    const left = rec.every(i => i < count / 2), right = rec.every(i => i >= count / 2);
    const contiguousFromLeft = rec[0] === 0, contiguousFromRight = rec[rec.length - 1] === count - 1;
    if (rec.length === 1) {
      if (rec[0] === 0) return { key: 'leftmost' };
      if (rec[0] === count - 1) return { key: 'rightmost' };
      return { key: 'lane', n: rec[0] + 1 };
    }
    if (contiguousFromLeft && left) return { key: 'left_n', n: rec.length };
    if (contiguousFromRight && right) return { key: 'right_n', n: rec.length };
    return { key: 'lanes_list', list: rec.map(i => i + 1) };
  }

  // Offline phrase generation. Languages: en, ar.
  const PHRASES = {
    en: {
      dist: d => d >= 1000 ? (d / 1000).toFixed(1).replace('.0', '') + ' kilometres' : Math.round(d / 50) * 50 + ' metres',
      mv: { left: 'turn left', right: 'turn right', through: 'continue straight', exit_right: 'take the exit on the right', exit_left: 'take the exit on the left',
            slight_left: 'bear left', slight_right: 'bear right', uturn: 'make a U-turn', merge: 'merge', split: 'follow the split' },
      where: w => ({ any: 'any lane', leftmost: 'the left lane', rightmost: 'the right lane', lane: 'lane ' + w.n,
        left_n: w.n === 1 ? 'the left lane' : 'either of the ' + w.n + ' left lanes', right_n: w.n === 1 ? 'the right lane' : 'either of the ' + w.n + ' right lanes',
        lanes_list: 'lanes ' + (w.list || []).join(' or ') }[w.key]),
      inLane: (d, where, mv) => 'In ' + d + ', use ' + where + ' to ' + mv + '.',
      stay: (where, mv) => 'Stay in ' + where + ' to ' + mv + '.',
      noLane: (d, mv) => 'In ' + d + ', ' + mv + '.',
      tooLate: 'You may miss the exit. Continue and follow the rerouting.',
      exitNum: n => 'Exit ' + n, thenRoad: r => 'onto ' + r, roundabout: n => 'At the roundabout, take exit number ' + n + '.',
      roundLane: where => 'Approach in ' + where + '.'
    },
    ar: {
      dist: d => d >= 1000 ? (d / 1000).toFixed(1) + ' كيلومتر' : Math.round(d / 50) * 50 + ' متر',
      mv: { left: 'انعطف يساراً', right: 'انعطف يميناً', through: 'تابع مباشرة', exit_right: 'اخرج من المخرج الأيمن', exit_left: 'اخرج من المخرج الأيسر',
            slight_left: 'ميل قليلاً لليسار', slight_right: 'ميل قليلاً لليمين', uturn: 'استدر للخلف', merge: 'اندمج', split: 'اتبع التفرع' },
      where: w => ({ any: 'أي مسار', leftmost: 'المسار الأيسر', rightmost: 'المسار الأيمن', lane: 'المسار ' + w.n,
        left_n: w.n === 1 ? 'المسار الأيسر' : 'أحد المسارين الأيسرين', right_n: w.n === 1 ? 'المسار الأيمن' : 'أحد المسارين الأيمنين',
        lanes_list: 'المسارات ' + (w.list || []).join(' أو ') }[w.key]),
      inLane: (d, where, mv) => 'بعد ' + d + '، استخدم ' + where + ' و' + mv + '.',
      stay: (where, mv) => 'ابقَ في ' + where + ' و' + mv + '.',
      noLane: (d, mv) => 'بعد ' + d + '، ' + mv + '.',
      tooLate: 'قد تفوتك المخرج. تابع واتبع إعادة التوجيه.',
      exitNum: n => 'المخرج ' + n, thenRoad: r => 'إلى ' + r, roundabout: n => 'عند الدوار، اخرج من المخرج رقم ' + n + '.',
      roundLane: where => 'اقترب من ' + where + '.'
    }
  };

  function instruction(g, lang) {
    const P = PHRASES[lang] || PHRASES.en;
    if (g.unsafe) return P.tooLate;
    const mv = P.mv[g.maneuver] || g.maneuver;
    const d = P.dist(g.distance);
    if (!g.hasLanes) return P.noLane(d, mv); // never invent a lane
    const where = P.where(laneWords(g.recommended, g.laneCount));
    if (g.correctLane === true) return P.stay(where, mv);
    return P.inLane(d, where, mv);
  }

  // Roundabout guidance from actual layout.
  function roundaboutGuidance(seg, exitNumber, lang) {
    const P = PHRASES[lang] || PHRASES.en;
    if (!seg || !seg.roundabout) return { text: null };
    const parts = [];
    const maneuver = exitNumber <= 1 ? 'right' : 'through';
    const rec = recommendedLanes(seg, exitNumber <= 1 ? 'right' : (exitNumber >= (seg.roundabout.exits.length) ? 'left' : 'through'));
    if (rec && seg.lanes) parts.push(P.roundLane(P.where(laneWords(rec, seg.lanes.length))));
    parts.push(P.roundabout(exitNumber));
    return { text: parts.join(' '), recommended: rec || [] };
  }

  // Announcement limiter: avoid repeats and contradictions.
  function makeAnnouncer(minGapMs) {
    let lastText = null, lastTime = 0, lastStage = null;
    return function (text, stage, now) {
      now = now == null ? Date.now() : now;
      if (!text) return false;
      if (text === lastText && now - lastTime < 20000) return false;
      if (stage != null && stage === lastStage && now - lastTime < (minGapMs || 6000)) return false;
      lastText = text; lastTime = now; lastStage = stage; return true;
    };
  }
  const STAGES = [800, 500, 200];
  function stageFor(distance) { return STAGES.filter(s => distance <= s).length; }

  // Stabiliser: only change displayed lane set after N consistent updates (anti-flicker with bad GPS).
  function makeStabilizer(n) {
    n = n || 3; let shown = null, cand = null, count = 0;
    return function (rec) {
      const key = JSON.stringify(rec);
      if (shown === null) { shown = key; return rec; }
      if (key === shown) { cand = null; count = 0; return JSON.parse(shown); }
      if (key === cand) count++; else { cand = key; count = 1; }
      if (count >= n) { shown = key; cand = null; count = 0; }
      return JSON.parse(shown);
    };
  }

  // Predictive traffic: only lane-specific if data supplies it; else segment-level only.
  function trafficInfo(segment, traffic) {
    const seg = traffic && traffic.segment && traffic.segment[segment.id];
    const lane = traffic && traffic.lane && traffic.lane[segment.id];
    return { segmentMinutes: seg != null ? seg : null, laneSpeeds: lane || null, laneSpecific: !!lane };
  }

  return { MOVES, parseOsmTurnLanes, recommendedLanes, warningDistance, lanesToCross, buildGuidance, laneWords,
    instruction, roundaboutGuidance, makeAnnouncer, stageFor, makeStabilizer, trafficInfo, PHRASES };
});
</script>
<script>
const E = LaneEngine;
// Sample offline road database (demo). Real data comes from the OSM import pipeline.
const ROUTE = [
  { id:'A1', name:'Sheikh Zayed Rd', len:3000, maneuver:'exit_right', segment:{ id:'A1', confidence:.9, source:'demo', updated:'2026-10-10',
      lanes:E.parseOsmTurnLanes('through|through|through;exit_right|exit_right',4), exitInfo:{ number:'12', destination:'Airport', nextRoad:'Airport Rd' } }, next:'Airport Rd' },
  { id:'R1', name:'Airport Rd', len:1500, maneuver:'roundabout', exitNumber:3, segment:{ id:'R1', confidence:.8, source:'demo', updated:'2026-10-10',
      lanes:[{index:0,turns:['left','through'],restrictions:[]},{index:1,turns:['through'],restrictions:[]},{index:2,turns:['through','right'],restrictions:[]}], roundabout:{exits:[{n:1},{n:2},{n:3}]} }, next:'Terminal 3' },
  { id:'S1', name:'Terminal 3 Access', len:1200, maneuver:'right', segment:{ id:'S1', lanes:null, confidence:.3, source:'demo' }, next:'Parking' }
];
const ARROW = {
  through:'M22 48V14M14 22l8-10 8 10', left:'M26 48V30Q26 22 18 22H10M16 14l-8 8 8 8', right:'M18 48V30Q18 22 26 22H34M28 14l8 8-8 8',
  slight_left:'M24 48V30L14 14M12 24l2-10 10 2', slight_right:'M20 48V30L30 14M32 24l-2-10-10 2', exit_right:'M16 48V32L34 16M34 28V16H22',
  exit_left:'M28 48V32L10 16M10 28V16h12', uturn:'M32 48V20Q32 12 24 12T16 20v8M10 22l6 8 6-8', merge:'M10 48L22 28M34 48L22 28M22 28V12', split:'M22 48V30M22 30L10 14M22 30L34 14'
};
const $ = id => document.getElementById(id);
const S = { i:0, pos:0, running:false, lane:3, last:0, timer:null, voice:true };
const announce = E.makeAnnouncer(6000), stab = E.makeStabilizer(3);
for (let i=0;i<4;i++){ const o=document.createElement('option'); o.value=i; o.textContent='Lane '+(i+1); if(i===3)o.selected=true; $('mylane').appendChild(o); }
$('mylane').onchange = () => S.lane = +$('mylane').value;
$('spd').oninput = () => $('spdv').textContent = $('spd').value + ' km/h';
$('voice').onclick = () => { S.voice = !S.voice; $('voice').textContent = 'Voice: ' + (S.voice?'on':'off'); };
$('lang').onchange = () => { document.documentElement.dir = $('lang').value==='ar'?'rtl':'ltr'; };

function speak(t){
  if(!S.voice || !('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(t); u.lang = $('lang').value==='ar'?'ar-SA':'en-GB';
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function laneSvg(turns, rec){
  const col = rec ? '#2bd48a' : '#9fb0d3';
  return '<svg viewBox="0 0 44 52" fill="none" stroke="'+col+'" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">'+
    turns.map(t => '<path d="'+(ARROW[t]||ARROW.through)+'"/>').join('')+'</svg>';
}
function drawLanes(g, shown, cur){
  const L = $('lanes'); L.innerHTML='';
  if(!g.hasLanes){ L.innerHTML='<div style="color:#8da0c4;text-align:center;padding:30px 0">No lane data for this road. Showing turn guidance only.</div>'; return; }
  g.lanes.forEach(l=>{
    const rec = shown.includes(l.index);
    const d = document.createElement('div'); d.className='lane'+(rec?' rec':'')+(cur===l.index?' cur':'');
    d.innerHTML = laneSvg(l.turns, rec)+'<small>'+(rec?'Use':'Lane '+(l.index+1))+'</small>';
    L.appendChild(d);
  });
}
function drawMap(){
  const total = ROUTE.reduce((a,s)=>a+s.len,0); let done = ROUTE.slice(0,S.i).reduce((a,s)=>a+s.len,0)+S.pos;
  const x = 20 + 360*done/total;
  $('mapsvg').innerHTML = '<path d="M20 70 C120 30 200 100 380 50" stroke="#2f3f66" stroke-width="10" fill="none" stroke-linecap="round"/>'+
    '<path d="M20 70 C120 30 200 100 380 50" stroke="#2bd48a" stroke-width="4" fill="none" stroke-dasharray="'+(360*done/total*1.05)+' 999"/>'+
    '<circle cx="'+x+'" cy="'+(60+Math.sin(done/total*6)*(-8))+'" r="7" fill="#ffb020"/>';
}
function tick(){
  const now = performance.now(), dt = Math.min(0.5,(now-S.last)/1000); S.last = now;
  const v = $('spd').value/3.6;
  S.pos += v*dt;
  const seg = ROUTE[S.i];
  if (S.pos >= seg.len){ S.i++; S.pos = 0; if (S.i>=ROUTE.length){ stop(); $('instr').textContent='You have arrived'; $('dist').textContent='✓'; speak($('lang').value==='ar'?'وصلت إلى وجهتك':'You have arrived'); return; } }
  render(v);
}
function render(v){
  const seg = ROUTE[S.i];
  const noise = $('noise').checked ? (Math.random()-0.5)*90 : 0; // GPS error in metres
  const dist = Math.max(0, seg.len - S.pos + noise);
  const acc = $('noise').checked ? 35 : 8;
  const lang = $('lang').value;
  let g, text;
  if (seg.maneuver === 'roundabout'){
    const r = E.roundaboutGuidance(seg.segment, seg.exitNumber, lang);
    g = E.buildGuidance({ segment:seg.segment, maneuver: seg.exitNumber>=3?'right':'through', distance:dist, speed:v, gpsAccuracy:acc, currentLane:S.lane<3?S.lane:null });
    g.maneuver = 'through'; text = r.text;
    if (r.recommended && r.recommended.length) { g.recommended = r.recommended; g.lanes.forEach(l=>l.recommended = r.recommended.includes(l.index)); }
  } else {
    g = E.buildGuidance({ segment:seg.segment, maneuver:seg.maneuver, distance:dist, speed:v, gpsAccuracy:acc, currentLane:seg.segment.lanes? Math.min(S.lane, seg.segment.lanes.length-1):null });
    text = E.instruction(g, lang);
  }
  const shown = E.makeStabilizer ? stab(g.recommended) : g.recommended;
  $('dist').textContent = dist>=1000 ? (dist/1000).toFixed(1)+' km' : Math.round(dist/10)*10+' m';
  $('road').textContent = seg.name + ' → ' + seg.next;
  $('instr').textContent = g.show ? text : (lang==='ar'?'تابع على الطريق':'Continue on '+seg.name);
  $('panel').classList.toggle('hidden', !g.show);
  if (g.show){
    drawLanes(g, shown, g.hasLanes?Math.min(S.lane,g.laneCount-1):null);
    let info='';
    if (g.exit){ info += '<span class="badge">'+E.PHRASES[lang].exitNum(g.exit.number)+'</span>'+(g.exit.destination?'<span class="badge">'+g.exit.destination+'</span>':'')+(g.exit.nextRoad?'<span class="badge">'+E.PHRASES[lang].thenRoad(g.exit.nextRoad)+'</span>':''); }
    if (g.hasLanes) info += '<span class="badge">'+g.laneCount+' lanes</span>';
    info += '<span class="badge">data: '+(g.confidence!=null?Math.round(g.confidence*100)+'%':'n/a')+'</span>';
    $('info').innerHTML = info;
    $('note').textContent = g.unsafe ? (lang==='ar'?'تغيير المسار الآن غير آمن':'Too late for a safe lane change. Rerouting after the exit.') : '';
    const stage = E.stageFor(dist);
    if (announce(text, S.i+'-'+stage)) speak(text);
  }
  drawMap();
}
function start(){ if(S.running) return; if(S.i>=ROUTE.length) reset(); S.running=true; S.last=performance.now(); S.timer=setInterval(tick,250); $('start').textContent='Pause'; if('speechSynthesis' in window) speechSynthesis.speak(new SpeechSynthesisUtterance('')); }
function stop(){ S.running=false; clearInterval(S.timer); $('start').textContent='Start drive'; }
function reset(){ stop(); S.i=0; S.pos=0; $('instr').textContent='Press Start drive'; $('dist').textContent='--'; $('panel').classList.add('hidden'); drawMap(); }
$('start').onclick = () => S.running ? stop() : start();
$('reset').onclick = reset;
drawMap();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
